<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <meta name="description" content="7TH UNIVERSE ESPORTS — FREE FIRE esports practice and recruitment platform." />
  <title>7TH UNIVERSE ESPORTS — FREE FIRE</title>

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#070707;
      --panel:#101010;
      --panel2:#151515;
      --line:#292929;
      --text:#f3f3f3;
      --muted:#a8a8a8;
      --red:#e5092f;
      --red2:#ff274d;
      --blue:#1c8cff;
      --green:#20c77a;
      --yellow:#ffd166;
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --radius:18px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 85% 10%, rgba(229,9,47,.12), transparent 28%),
        radial-gradient(circle at 10% 90%, rgba(28,140,255,.08), transparent 30%),
        var(--bg);
    }

    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}

    .hidden{display:none !important}
    .app{min-height:100vh}
    .container{width:min(1180px,92%);margin:auto}

    /* Landing */
    .landing-shell{min-height:100vh;display:grid;place-items:center;padding:20px}
    .landing{
      width:min(1080px,100%);
      border:1px solid var(--line);
      border-radius:28px;
      background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));
      box-shadow:var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .landing::before{
      content:"";
      position:absolute;inset:0;
      background:
        linear-gradient(135deg,transparent 0 55%,rgba(229,9,47,.05)),
        linear-gradient(45deg,transparent 0 60%,rgba(28,140,255,.035));
      pointer-events:none
    }

    .landing-top{
      display:flex;justify-content:space-between;gap:12px;align-items:center;
      padding:18px 20px;border-bottom:1px solid var(--line)
    }
    .brand-mini{font-size:14px;font-weight:900;letter-spacing:1.8px}
    .brand-mini span{color:var(--red)}
    .brand-status{
      display:flex;align-items:center;gap:8px;
      font-size:10px;font-weight:900;letter-spacing:1.1px;color:#8e8e8e
    }
    .status-dot{
      width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 12px rgba(32,199,122,.7)
    }
    .login-badge{
      display:inline-flex;align-items:center;padding:7px 9px;
      border:1px solid rgba(28,140,255,.3);border-radius:999px;
      background:rgba(28,140,255,.06);color:#79bcff;
      font-size:9px;font-weight:1000;letter-spacing:1px;margin-bottom:10px
    }

    .landing-top .actions{display:flex;gap:10px}

    .landing-body{
      display:grid;grid-template-columns:1.05fr .95fr;min-height:610px
    }
    .hero{
      padding:60px clamp(28px,5vw,70px);
      display:flex;flex-direction:column;justify-content:center;
      border-right:1px solid var(--line)
    }
    .eyebrow{
      font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);font-weight:900
    }
    .hero h1{
      margin:12px 0 10px;font-size:clamp(42px,6vw,76px);line-height:.92;
      letter-spacing:-3px;text-transform:uppercase
    }
    .hero h1 strong{color:var(--red)}
    .hero h2{font-size:22px;margin:0 0 14px;color:#ddd}
    .hero p{color:var(--muted);max-width:620px;line-height:1.7}
    .hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}
    .tag{
      padding:8px 11px;border:1px solid var(--line);border-radius:999px;
      background:#0d0d0d;color:#d8d8d8;font-size:12px;font-weight:800
    }

    .auth-card{padding:38px;display:flex;align-items:center}
    .auth-box{width:100%;max-width:470px;margin:auto}
    .auth-box h3{font-size:28px;margin:0 0 7px}
    .auth-box .sub{color:var(--muted);margin:0 0 24px;font-size:14px}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
    .tab{
      padding:11px;border-radius:11px;border:1px solid var(--line);
      background:#0b0b0b;color:#bbb
    }
    .tab.active{background:rgba(229,9,47,.12);color:#fff;border-color:rgba(229,9,47,.45)}
    .admin-mini-btn{
      position:absolute;left:18px;bottom:18px;border:1px solid var(--line);
      padding:10px 12px;border-radius:10px;background:#0c0c0c;color:#bbb
    }

    /* Buttons/forms */
    .btn{
      border:0;border-radius:12px;padding:12px 16px;font-weight:900;
      transition:.18s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
    .btn-blue{background:linear-gradient(135deg,#0c66c9,var(--blue));color:#fff}
    .btn-dark{background:#121212;border:1px solid var(--line);color:#ddd}
    .btn-green{background:#0d5e42;color:#fff}
    .btn-danger{background:#6f0d1c;color:#fff}
    .btn-small{padding:9px 11px;font-size:12px}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:#c9c9c9;font-weight:800;margin-bottom:7px}
    .field input,.field select,.field textarea{
      width:100%;border:1px solid var(--line);background:#0b0b0b;color:#fff;
      border-radius:12px;padding:12px 13px;outline:none
    }
    .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(28,140,255,.75)}
    .field textarea{min-height:100px;resize:vertical}
    .hint{font-size:11px;color:#777;margin-top:5px}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

    /* App */
    .topbar{
      position:sticky;top:0;z-index:40;
      background:rgba(7,7,7,.9);backdrop-filter:blur(18px);
      border-bottom:1px solid var(--line)
    }
    .topbar-inner{
      min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px
    }
    .brand{
      font-size:16px;font-weight:1000;letter-spacing:1.5px;white-space:nowrap
    }
    .brand b{color:var(--red)}
    .nav{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
    .nav-btn{
      background:transparent;border:1px solid transparent;color:#aaa;
      padding:10px 12px;border-radius:10px;font-weight:800;font-size:12px
    }
    .nav-btn.active,.nav-btn:hover{background:#111;color:#fff;border-color:var(--line)}
    .user-chip{display:flex;align-items:center;gap:9px}
    .avatar{
      width:34px;height:34px;border-radius:10px;background:#111;border:1px solid var(--line);
      object-fit:cover
    }
    .user-meta{font-size:11px;line-height:1.3}
    .user-meta strong{display:block;font-size:12px}
    .user-meta span{color:#7d7d7d}

    .page{padding:32px 0 60px}
    .page-title{margin-bottom:22px}
    .page-title h2{font-size:30px;margin:0 0 6px}
    .page-title p{margin:0;color:var(--muted);font-size:14px}

    .hero-card{
      padding:28px;border:1px solid var(--line);border-radius:22px;
      background:linear-gradient(135deg,rgba(229,9,47,.10),rgba(28,140,255,.06));
      box-shadow:var(--shadow)
    }
    .hero-card h2{margin:0 0 7px;font-size:30px}
    .hero-card p{color:#aaa;line-height:1.65;margin:0;max-width:780px}

    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .cards-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{
      border:1px solid var(--line);background:linear-gradient(180deg,#101010,#0d0d0d);
      border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(0,0,0,.2)
    }
    .card-head{display:flex;gap:12px;align-items:center}
    .team-logo{
      width:54px;height:54px;border-radius:14px;object-fit:cover;background:#050505;border:1px solid var(--line)
    }
    .placeholder-logo{
      display:grid;place-items:center;font-size:18px;font-weight:1000;
    }
    .card-head h3{margin:0;font-size:18px}
    .card-head p{margin:4px 0 0;color:#888;font-size:12px}
    .badges{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}
    .badge{
      padding:6px 8px;border:1px solid var(--line);border-radius:999px;
      font-size:10px;font-weight:900;color:#c9c9c9;background:#101010
    }
    .badge.red{border-color:rgba(229,9,47,.35);color:#ff6b84;background:rgba(229,9,47,.08)}
    .badge.blue{border-color:rgba(28,140,255,.35);color:#6db7ff;background:rgba(28,140,255,.08)}
    .badge.green{border-color:rgba(32,199,122,.35);color:#75e4b0;background:rgba(32,199,122,.08)}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
    .info{padding:10px;border-radius:11px;background:#0a0a0a;border:1px solid #1b1b1b}
    .info small{display:block;color:#666;margin-bottom:3px;font-size:9px;text-transform:uppercase;letter-spacing:.6px}
    .info strong{font-size:12px;color:#ddd}
    .card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

    .empty{
      padding:50px 18px;text-align:center;border:1px dashed #2c2c2c;border-radius:16px;color:#777
    }

    .section-gap{margin-top:26px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .stat{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0e0e0e}
    .stat small{color:#777}
    .stat strong{display:block;font-size:28px;margin-top:8px}

    /* Admin */
    .admin-shell{display:grid;grid-template-columns:230px 1fr;gap:18px}
    .admin-side{border:1px solid var(--line);border-radius:16px;background:#0e0e0e;padding:10px;height:max-content;position:sticky;top:86px}
    .admin-side button{
      width:100%;background:transparent;border:0;color:#999;text-align:left;
      padding:11px;border-radius:10px;font-weight:800;font-size:12px
    }
    .admin-side button.active,.admin-side button:hover{background:#171717;color:#fff}
    .admin-main{min-width:0}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:12px;border-bottom:1px solid #202020;text-align:left;font-size:12px;vertical-align:top}
    th{color:#777;font-size:10px;text-transform:uppercase;letter-spacing:.8px}
    td .mini-logo{width:34px;height:34px;border-radius:8px;object-fit:cover}
    tr:last-child td{border-bottom:0}

    /* Modal */
    .modal{
      position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
      background:rgba(0,0,0,.72);padding:18px
    }
    .modal.open{display:flex}
    .modal-box{
      width:min(700px,100%);max-height:92vh;overflow:auto;
      background:#0d0d0d;border:1px solid var(--line);border-radius:20px;padding:20px
    }
    .modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .modal-head h3{margin:0}
    .close-btn{border:1px solid var(--line);background:#121212;color:#aaa;width:34px;height:34px;border-radius:10px}

    /* Toast */
    #toast{
      position:fixed;right:18px;bottom:18px;z-index:200;max-width:360px;
      padding:13px 15px;border-radius:13px;border:1px solid var(--line);
      background:#111;box-shadow:var(--shadow);display:none;font-size:13px
    }
    #toast.show{display:block}
    #toast.error{border-color:rgba(229,9,47,.45)}
    #toast.success{border-color:rgba(32,199,122,.45)}

    .status-line{font-size:12px;color:#888;margin-top:9px}
    .status-line b{color:#ddd}
    .danger-note{
      padding:11px 12px;border:1px solid rgba(229,9,47,.25);
      background:rgba(229,9,47,.06);border-radius:11px;color:#f4a2b0;font-size:12px;line-height:1.5
    }

    @media (max-width:960px){
      .landing-body{grid-template-columns:1fr}
      .hero{border-right:0;border-bottom:1px solid var(--line)}
      .cards,.cards-3{grid-template-columns:1fr}
      .stat-grid{grid-template-columns:1fr 1fr}
      .admin-shell{grid-template-columns:1fr}
      .admin-side{position:static;display:flex;overflow:auto;gap:6px}
      .admin-side button{width:auto;white-space:nowrap}
    }

    @media (max-width:650px){
      .landing-top{align-items:flex-start}
      .landing-top .actions{flex-direction:column}
      .landing-body{min-height:auto}
      .hero{padding:38px 24px}
      .auth-card{padding:24px}
      .grid-2,.grid-3,.info-grid{grid-template-columns:1fr}
      .topbar-inner{align-items:flex-start;padding:10px 0;flex-wrap:wrap}
      .nav{order:3;width:100%;overflow:auto;justify-content:flex-start;flex-wrap:nowrap}
      .page{padding-top:22px}
      .user-meta{display:none}
      .stat-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>

<div id="app" class="app"></div>

<!-- Generic modal -->
<div id="modal" class="modal" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Details</h3>
      <button class="close-btn" id="modalClose" type="button">×</button>
    </div>
    <div id="modalBody" style="margin-top:16px"></div>
  </div>
</div>

<div id="toast"></div>

<script src="./script.js"></script>
</body>
</html>
