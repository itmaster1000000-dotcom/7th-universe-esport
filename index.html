<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101d">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="7TH UNIVERSE ESPORTS — Free Fire competitive practice and recruitment platform.">
  <link rel="icon" type="image/png" href="./7th-universe-esports-logo.png">
  <link rel="apple-touch-icon" href="./7th-universe-esports-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>7TH UNIVERSE • ESPORTS | FREE FIRE</title>

  <style>
    :root{
      --bg:#02060b;
      --bg2:#06101d;
      --panel:#071321;
      --panel2:#0a1828;
      --panel3:#0e2034;
      --line:rgba(85,170,255,.15);
      --line2:rgba(100,190,255,.28);
      --text:#eef7ff;
      --muted:#8ba5bd;
      --muted2:#587189;
      --blue:#0e6cff;
      --blue2:#42a9ff;
      --cyan:#2de0ff;
      --good:#24d68a;
      --warn:#ffd56a;
      --danger:#ff617d;
      --shadow:0 30px 90px rgba(0,0,0,.55);
      --shadow2:0 16px 46px rgba(0,0,0,.28);
      --radius:18px;
      --radius2:24px;
      --max:1260px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 10% 0%,rgba(14,108,255,.12),transparent 26%),
        radial-gradient(circle at 92% 4%,rgba(45,224,255,.08),transparent 24%),
        radial-gradient(circle at 55% 100%,rgba(14,108,255,.06),transparent 28%),
        linear-gradient(180deg,#02060b 0%,#06111e 55%,#03080f 100%);
      overflow-x:hidden;
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.16;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:34px 34px;
    }

    button,input,select,textarea{font:inherit}
    button,a{-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}
    .container{width:min(calc(100% - 20px),var(--max));margin:auto}
    .topline{
      height:3px;
      background:linear-gradient(90deg,var(--blue),var(--cyan),#fff,var(--blue2));
      box-shadow:0 0 28px rgba(14,108,255,.25)
    }

    /* ---------- Shared ---------- */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      min-height:42px;padding:10px 14px;border:1px solid rgba(140,210,255,.13);
      border-radius:12px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
      font-size:10px;font-weight:1000;letter-spacing:.055em;transition:.16s ease;
      text-transform:uppercase
    }
    .btn:hover{transform:translateY(-1px);border-color:rgba(140,210,255,.28)}
    .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn-primary{
      border-color:rgba(62,164,255,.55);
      background:linear-gradient(135deg,#0754cf,#1597ff);
      box-shadow:0 12px 28px rgba(14,108,255,.2)
    }
    .btn-cyan{
      border-color:rgba(45,224,255,.34);
      background:linear-gradient(135deg,#07647c,#14a7ca);
    }
    .btn-dark{background:rgba(4,12,21,.82);border-color:var(--line);color:#cfe3f7}
    .btn-green{background:rgba(10,99,68,.18);border-color:rgba(36,214,138,.32);color:#a6f3d2}
    .btn-danger{background:rgba(125,25,49,.22);border-color:rgba(255,97,125,.25);color:#ffc0cc}
    .btn-small{min-height:34px;padding:7px 10px;border-radius:10px;font-size:8px}
    .btn-block{width:100%}

    .card,.panel{
      position:relative;overflow:hidden;padding:17px;border:1px solid var(--line);
      border-radius:var(--radius2);
      background:linear-gradient(180deg,rgba(10,28,46,.92),rgba(4,12,21,.96));
      box-shadow:var(--shadow2)
    }
    .card:before,.panel:before{
      content:"";position:absolute;top:0;left:0;width:130px;height:2px;
      background:linear-gradient(90deg,var(--blue),var(--cyan),transparent)
    }
    .kicker{
      color:#74bcff;font-size:8px;font-weight:1000;letter-spacing:.19em;text-transform:uppercase
    }
    .title{
      margin:5px 0 0;font-family:"Barlow Condensed",sans-serif;font-size:40px;line-height:.94;
      font-weight:900;letter-spacing:.045em;text-transform:uppercase
    }
    .desc{max-width:690px;color:var(--muted);font-size:10px;line-height:1.72}
    .subtle{margin-top:4px;color:var(--muted);font-size:9px;line-height:1.65}
    .panel-head{
      display:flex;align-items:flex-start;justify-content:space-between;gap:13px;margin-bottom:13px
    }
    .panel-head h3{
      margin:0;font-family:"Barlow Condensed",sans-serif;font-size:27px;line-height:1;
      font-weight:900;letter-spacing:.04em;text-transform:uppercase
    }
    .badge{
      display:inline-flex;align-items:center;justify-content:center;min-height:25px;padding:5px 9px;
      border:1px solid rgba(255,255,255,.08);border-radius:999px;font-size:8px;font-weight:1000;
      letter-spacing:.11em;text-transform:uppercase;white-space:nowrap
    }
    .badge-blue{color:#97d1ff;background:rgba(14,108,255,.08);border-color:rgba(64,168,255,.24)}
    .badge-cyan{color:#9ef1ff;background:rgba(45,224,255,.06);border-color:rgba(45,224,255,.23)}
    .badge-green{color:#98efc9;background:rgba(36,214,138,.06);border-color:rgba(36,214,138,.22)}
    .badge-warn{color:#ffe5a2;background:rgba(255,213,106,.06);border-color:rgba(255,213,106,.22)}
    .badge-danger{color:#ffc2ce;background:rgba(255,97,125,.06);border-color:rgba(255,97,125,.23)}

    label{
      display:grid;gap:7px;color:#b9cee1;font-size:9px;font-weight:900;letter-spacing:.055em
    }
    .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
    .field-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
    .full{grid-column:1/-1}
    input,select,textarea{
      width:100%;min-height:44px;padding:11px 12px;border:1px solid rgba(115,190,255,.12);
      border-radius:11px;color:#eff8ff;background:rgba(2,8,15,.8);outline:none
    }
    input:focus,select:focus,textarea:focus{
      border-color:rgba(62,164,255,.56);box-shadow:0 0 0 3px rgba(14,108,255,.08)
    }
    input::placeholder,textarea::placeholder{color:#526c84}
    textarea{resize:vertical;min-height:92px}
    input[type=file]{padding:9px}
    .hint{margin-top:6px;color:var(--muted2);font-size:8px;line-height:1.6}
    .status{
      display:none;margin-top:10px;padding:10px 11px;border:1px solid rgba(115,190,255,.12);
      border-radius:11px;font-size:9px;line-height:1.6
    }
    .status.show{display:block}
    .status.info{color:#b9dcff;background:rgba(14,108,255,.055);border-color:rgba(64,168,255,.2)}
    .status.ok{color:#aef3d3;background:rgba(36,214,138,.055);border-color:rgba(36,214,138,.2)}
    .status.error{color:#ffc4ce;background:rgba(255,97,125,.055);border-color:rgba(255,97,125,.2)}
    .divider{height:1px;background:rgba(115,190,255,.08);margin:16px 0}
    .empty{
      padding:23px 14px;text-align:center;color:#6c849a;border:1px dashed rgba(110,180,240,.14);
      border-radius:14px;background:rgba(255,255,255,.014);font-size:9px
    }

    /* ---------- Public header / auth ---------- */
    .public-header{
      position:sticky;top:0;z-index:50;backdrop-filter:blur(18px);
      background:rgba(2,7,13,.86);border-bottom:1px solid rgba(85,170,255,.13)
    }
    .public-nav{
      width:min(calc(100% - 20px),var(--max));margin:auto;min-height:78px;
      display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px
    }
    .nav-left,.nav-right{display:flex;align-items:center;gap:8px}
    .nav-right{justify-content:flex-end}
    .brand-center{display:flex;align-items:center;justify-content:center;gap:10px}
    .brand-logo{
      width:50px;height:50px;border-radius:14px;object-fit:cover;
      border:1px solid rgba(120,200,255,.2);box-shadow:0 0 28px rgba(14,108,255,.16)
    }
    .brand-title{
      font-family:"Barlow Condensed",sans-serif;font-size:27px;line-height:.9;font-weight:900;
      letter-spacing:.08em;white-space:nowrap
    }
    .brand-title span{color:var(--blue2)}
    .brand-sub{
      margin-top:4px;color:#68829a;font-size:7px;font-weight:800;letter-spacing:.2em;text-transform:uppercase
    }
    .nav-action{
      min-height:36px;padding:8px 10px;border:1px solid rgba(115,190,255,.12);border-radius:10px;
      background:rgba(5,14,24,.72);color:#b8cee2;font-size:8px;font-weight:1000;letter-spacing:.07em
    }
    .nav-action:hover{border-color:rgba(64,168,255,.33);color:#fff}
    .nav-action.admin{color:#c8ecff;border-color:rgba(45,224,255,.30);background:linear-gradient(135deg,rgba(14,108,255,.15),rgba(45,224,255,.055))}
    .nav-spacer{min-width:1px}
    .auth-actions .btn{min-width:165px}
    .auth-actions .btn-secondary{border-color:rgba(45,224,255,.28);background:rgba(45,224,255,.055);color:#b8efff}

    .public-page{min-height:calc(100vh - 81px);padding:28px 0 50px}
    .auth-layout{
      width:min(calc(100% - 20px),1050px);margin:auto;
      display:grid;grid-template-columns:1.02fr .98fr;gap:15px;align-items:stretch
    }
    .auth-hero{
      padding:30px 28px;min-height:610px;display:flex;flex-direction:column;justify-content:center
    }
    .auth-hero h1{
      margin:13px 0 10px;font-family:"Barlow Condensed",sans-serif;font-size:76px;line-height:.84;
      letter-spacing:-.015em;text-transform:uppercase
    }
    .auth-hero h1 .w{color:#f4f8fd}.auth-hero h1 .b{color:var(--blue2)}.auth-hero h1 .c{color:var(--cyan)}
    .auth-hero h2{
      margin:0 0 13px;font-family:"Barlow Condensed",sans-serif;font-size:25px;
      letter-spacing:.03em;text-transform:uppercase
    }
    .feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:22px}
    .feature{
      padding:12px;border:1px solid rgba(85,170,255,.1);border-radius:14px;background:rgba(7,19,32,.62)
    }
    .feature b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.04em}
    .feature span{display:block;margin-top:4px;color:#647f97;font-size:8px;line-height:1.55}
    .access-note{
      margin-top:18px;padding:12px 13px;border:1px solid rgba(45,224,255,.18);
      border-radius:12px;background:rgba(45,224,255,.035);color:#acdff1;font-size:8px;line-height:1.65
    }

    .auth-card{padding:24px 20px;display:flex;align-items:center}
    .auth-inner{width:100%;max-width:470px;margin:auto}
    .auth-logo-row{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:16px}
    .auth-logo-row img{width:61px;height:61px;border-radius:17px;border:1px solid rgba(100,190,255,.2);box-shadow:0 0 25px rgba(14,108,255,.13)}
    .auth-logo-row strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:29px;letter-spacing:.06em}
    .auth-logo-row span{display:block;margin-top:4px;color:#668097;font-size:7px;font-weight:900;letter-spacing:.17em}
    .auth-tabs{display:flex;gap:7px;justify-content:center;margin:0 0 16px}
    .auth-tab{
      min-width:120px;padding:9px 11px;border:1px solid rgba(115,190,255,.09);border-radius:10px;
      background:rgba(255,255,255,.02);color:#778fa6;font-size:8px;font-weight:1000;letter-spacing:.1em
    }
    .auth-tab.active{color:#fff;border-color:rgba(64,168,255,.34);background:linear-gradient(135deg,rgba(14,108,255,.17),rgba(45,224,255,.05))}
    .auth-title{text-align:center}.auth-title .title{font-size:43px}.auth-title p{margin:7px auto 0;color:var(--muted);font-size:9px;line-height:1.65}
    .auth-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:13px}
    .micro{text-align:center;color:#60798f;font-size:8px;line-height:1.6;margin-top:10px}
    .micro button{border:0;background:transparent;color:#8fcbff;font-weight:900;padding:0}

    /* ---------- Member header / sections ---------- */
    .app-header{
      position:sticky;top:0;z-index:60;backdrop-filter:blur(18px);
      background:rgba(2,7,13,.86);border-bottom:1px solid rgba(85,170,255,.14)
    }
    .app-nav{
      width:min(calc(100% - 20px),var(--max));margin:auto;min-height:79px;
      display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center
    }
    .app-brand{display:flex;align-items:center;gap:9px}
    .app-brand img{width:43px;height:43px;border-radius:12px;border:1px solid rgba(100,190,255,.18)}
    .app-brand strong{font-family:"Barlow Condensed",sans-serif;font-size:23px;letter-spacing:.08em}
    .app-brand span{display:block;margin-top:2px;color:#5f7890;font-size:6px;font-weight:900;letter-spacing:.2em}
    .app-nav-links{display:flex;align-items:center;justify-content:center;gap:5px;overflow:auto}
    .app-link{
      flex:0 0 auto;padding:10px 11px;border:1px solid transparent;border-radius:10px;
      background:transparent;color:#7992a8;font-size:8px;font-weight:1000;letter-spacing:.06em
    }
    .app-link.active,.app-link:hover{color:#fff;background:#071625;border-color:rgba(85,170,255,.14)}
    .profile-chip{display:flex;align-items:center;gap:8px}
    .profile-logo{width:35px;height:35px;border-radius:10px;border:1px solid rgba(85,170,255,.2);object-fit:cover;background:#071321}
    .profile-meta small{display:block;color:#58728b;font-size:6px;text-transform:uppercase;letter-spacing:.09em}
    .profile-meta strong{display:block;font-size:9px}

    .page{padding:24px 0 55px}
    .hero{
      padding:24px;border:1px solid rgba(85,170,255,.22);border-radius:22px;
      background:
        radial-gradient(circle at 95% 10%,rgba(14,108,255,.17),transparent 32%),
        radial-gradient(circle at 5% 90%,rgba(45,224,255,.06),transparent 25%),
        linear-gradient(135deg,rgba(8,26,45,.96),rgba(3,10,17,.98));
      box-shadow:var(--shadow)
    }
    .hero h2{
      margin:9px 0 7px;font-family:"Barlow Condensed",sans-serif;font-size:36px;line-height:.95;
      letter-spacing:.03em;text-transform:uppercase
    }
    .hero p{max-width:850px;margin:0;color:#7e97ae;font-size:10px;line-height:1.7}
    .hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
    .quick{
      text-align:left;padding:15px;border:1px solid rgba(85,170,255,.12);border-radius:15px;
      background:rgba(7,19,32,.84);color:#fff;transition:.16s ease
    }
    .quick:hover{transform:translateY(-1px);border-color:rgba(64,168,255,.26)}
    .qicon{font-size:19px;color:#83ceff;font-family:"Barlow Condensed",sans-serif;font-weight:900}
    .quick b{display:block;margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.04em}
    .quick span{display:block;margin-top:3px;color:#627c94;font-size:8px;line-height:1.5}

    .member-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:13px;margin-top:14px}
    .stack{display:grid;gap:13px}
    .feed-list{display:grid;gap:9px}
    .challenge-card,.recruit-card{
      padding:13px;border:1px solid rgba(85,170,255,.1);border-radius:14px;background:rgba(255,255,255,.02)
    }
    .row-between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .identity{display:flex;align-items:center;gap:9px}
    .mini-logo{width:43px;height:43px;border-radius:11px;object-fit:cover;border:1px solid rgba(85,170,255,.16);background:#06111c}
    .mini-placeholder{display:grid;place-items:center;color:#76bfff;font-family:"Barlow Condensed",sans-serif;font-weight:900}
    .name{
      font-family:"Barlow Condensed",sans-serif;font-size:21px;line-height:.95;font-weight:900;
      letter-spacing:.03em;text-transform:uppercase
    }
    .meta{margin-top:3px;color:#637d94;font-size:7px;text-transform:uppercase;letter-spacing:.09em}
    .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .pill{
      display:inline-flex;align-items:center;min-height:23px;padding:5px 8px;border:1px solid rgba(85,170,255,.1);
      border-radius:999px;color:#a6c9e5;background:rgba(8,24,39,.78);font-size:7px;font-weight:900
    }
    .info-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
    .info-box{padding:9px;border:1px solid rgba(85,170,255,.08);border-radius:10px;background:rgba(3,10,17,.72)}
    .info-box small{display:block;color:#587189;font-size:6px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
    .info-box strong{font-size:8px;color:#d5e8f7}
    .note{margin-top:9px;color:#7891a8;font-size:8px;line-height:1.55}
    .card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}

    /* ---------- Create forms ---------- */
    .form-card{max-width:980px}
    .form-tip{
      padding:10px 11px;border:1px solid rgba(45,224,255,.14);border-radius:11px;
      background:rgba(45,224,255,.035);color:#9ed8e7;font-size:8px;line-height:1.55;margin-bottom:13px
    }

    /* ---------- Match time picker ---------- */
    .time-picker-button{
      width:100%;min-height:82px;padding:14px 16px;border:1px solid rgba(45,224,255,.18);
      border-radius:14px;color:#fff;background:linear-gradient(180deg,rgba(8,29,47,.94),rgba(3,11,19,.94));
      text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .time-picker-button:hover{border-color:rgba(45,224,255,.48);box-shadow:0 0 0 3px rgba(45,224,255,.06)}
    .time-picker-button .time-value{font:900 31px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;color:#dff9ff}
    .time-picker-button .time-hint{display:block;margin-top:4px;color:#6989a1;font-size:7px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .time-picker-button .time-icon{font-size:22px;color:#4ccfff}
    .time-picker-modal{display:grid;gap:13px}
    .time-picker-display{padding:18px 14px;text-align:center;border:1px solid rgba(45,224,255,.18);border-radius:16px;background:linear-gradient(180deg,rgba(8,33,52,.84),rgba(3,12,21,.92))}
    .time-picker-display strong{display:block;font:900 48px/.9 "Barlow Condensed",sans-serif;letter-spacing:.05em;color:#effcff}
    .time-picker-display small{display:block;margin-top:6px;color:#79a5bc;font-size:7px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .time-picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .time-picker-grid label{gap:6px}
    .time-picker-period{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .time-period-btn{min-height:55px;border:1px solid rgba(115,190,255,.10);border-radius:12px;background:rgba(255,255,255,.02);color:#7893a8;font-size:11px;font-weight:1000;letter-spacing:.08em}
    .time-period-btn.active{color:#fff;border-color:rgba(45,224,255,.42);background:linear-gradient(135deg,rgba(14,108,255,.26),rgba(45,224,255,.08))}
    .time-picker-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
    .time-picker-actions .left-actions,.time-picker-actions .right-actions{display:flex;gap:8px;flex-wrap:wrap}

    /* ---------- Admin ---------- */
    .admin-grid{display:grid;grid-template-columns:215px 1fr;gap:14px}
    .admin-tabs{
      display:grid;gap:6px;height:max-content;padding:8px;border:1px solid rgba(85,170,255,.11);
      border-radius:15px;background:#06111c;position:sticky;top:95px
    }
    .admin-tab{
      border:1px solid transparent;border-radius:10px;padding:11px 10px;text-align:left;
      background:transparent;color:#738da4;font-size:8px;font-weight:1000;letter-spacing:.08em
    }
    .admin-tab.active,.admin-tab:hover{background:#0a1928;border-color:rgba(64,168,255,.15);color:#fff}
    .admin-count{
      float:right;min-width:18px;height:18px;display:grid;place-items:center;border-radius:999px;
      background:rgba(14,108,255,.12);color:#8dcbff;font-size:7px
    }
    .table-shell{overflow:auto;border:1px solid rgba(85,170,255,.09);border-radius:13px}
    table{width:100%;min-width:760px;border-collapse:collapse}
    th,td{padding:11px;border-bottom:1px solid rgba(85,170,255,.08);text-align:left;font-size:8px;vertical-align:top}

    /* ---------- Admin management ---------- */
    .admin-action-grid{display:flex;flex-wrap:wrap;gap:6px;min-width:220px}

    .btn-logout{border-color:rgba(255,82,115,.35);background:linear-gradient(135deg,rgba(255,48,86,.12),rgba(110,8,30,.09));color:#ffd2dc}

    /* ---------- Modal / toast ---------- */
    .modal-backdrop{
      position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
      padding:16px;background:rgba(0,0,0,.72)
    }
    .modal-backdrop.open{display:flex}
    .modal-box{
      width:min(680px,100%);max-height:90vh;overflow:auto;padding:19px;border:1px solid rgba(85,170,255,.2);
      border-radius:19px;background:#06111d;box-shadow:var(--shadow)
    }
    .modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}

    .close{
      width:34px;height:34px;border-radius:9px;border:1px solid rgba(85,170,255,.12);background:#0a1826;color:#a4bdd3

    #toast{
      position:fixed;right:15px;bottom:15px;z-index:150;display:none;max-width:360px;
      padding:12px 14px;border-radius:12px;border:1px solid rgba(85,170,255,.16);

    #toast.show{display:block}
    #toast.ok{border-color:rgba(36,214,138,.24);color:#aaf3d1}

      .member-grid{grid-template-columns:1fr}

    }
    @media (max-width:760px){
      .public-nav{grid-template-columns:auto 1fr auto}
      .brand-title{font-size:22px}
      .brand-logo{width:42px;height:42px}
      .brand-sub{display:none}
      .nav-action{font-size:7px;padding:8px}
      .nav-left{order:1}
      .public-nav{grid-template-columns:auto 1fr auto}
      .nav-right{justify-content:flex-end}
      .brand-center{justify-content:flex-start}
      .auth-hero{padding:23px 19px}
      .auth-hero h1{font-size:57px}
      .feature-grid{grid-template-columns:1fr}
      .auth-card{padding:20px 16px}
      .field-grid,.field-grid-3{grid-template-columns:1fr}
      .full{grid-column:auto}
      .quick-grid{grid-template-columns:1fr 1fr}
      .app-nav{grid-template-columns:auto 1fr auto;gap:8px}
      .app-nav-links{grid-column:1/-1;grid-row:2;justify-content:flex-start;padding-bottom:7px}

      .page{padding-top:18px}

    @media (max-width:480px){
      .auth-actions .btn{width:100%}
      .quick-grid{grid-template-columns:1fr}
      .auth-title .title{font-size:37px}

      .info-row{grid-template-columns:1fr}
      .app-brand strong{font-size:19px}
      .public-nav{min-height:69px}
    }


    /* ---------- Ranking format controls ---------- */
    .ranking-format-grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0
    }
    .ranking-format-btn{
      position:relative;min-height:58px;padding:10px 12px;border:1px solid rgba(85,170,255,.13);
      border-radius:14px;background:linear-gradient(180deg,rgba(9,27,45,.88),rgba(3,11,19,.95));
      color:#9bb6cd;font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase;
      transition:.16s ease;overflow:hidden
    }
    .ranking-format-btn:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:2px;background:linear-gradient(90deg,transparent,#1b86ff,transparent);opacity:.28}
    .ranking-format-btn:hover{transform:translateY(-1px);border-color:rgba(86,180,255,.34);color:#e8f6ff}
    .ranking-format-btn.active{color:#fff;border-color:rgba(45,224,255,.48);background:linear-gradient(135deg,rgba(7,73,136,.78),rgba(13,121,151,.42));box-shadow:0 12px 30px rgba(7,109,255,.14),inset 0 0 0 1px rgba(45,224,255,.08)}
    .ranking-format-btn strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:21px;line-height:1}
    .ranking-format-btn span{display:block;margin-top:4px;color:#6f8da6;font-size:7px}
    .ranking-format-btn.active span{color:#a5e9ff}

    .result-format-select{margin-top:12px}
    .result-format-note{margin-top:7px;color:#66849c;font-size:8px;line-height:1.5}

    @media(max-width:760px){
      .ranking-format-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    }

    /* ---------- Result workflow ---------- */
    .result-submit-panel{padding:18px}
    .result-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 16px}
    .result-step{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid rgba(76,175,255,.12);border-radius:14px;background:linear-gradient(180deg,rgba(11,30,49,.8),rgba(2,9,16,.76))}
    .result-step>span{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:#d9f4ff;background:linear-gradient(135deg,#0754cf,#1597ff);font:900 10px/1 "Barlow Condensed",sans-serif}
    .result-step b{display:block;color:#eaf6ff;font-size:9px;letter-spacing:.06em}
    .result-step small{display:block;margin-top:3px;color:#6f8ba5;font-size:7px;line-height:1.45}
    .result-challenge-box{margin:12px 0;padding:13px;border:1px solid rgba(45,224,255,.16);border-radius:14px;background:linear-gradient(180deg,rgba(8,28,46,.8),rgba(3,11,19,.74))}
    .result-empty-state{display:grid;gap:4px;color:#708aa1;text-align:center;padding:10px 6px}
    .result-empty-state strong{color:#bfe4ff;font-size:9px;letter-spacing:.08em}
    .result-empty-state span{font-size:8px}
    .result-challenge-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .result-challenge-head small,.result-meta-grid small{display:block;color:#6f8ba5;font-size:7px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .result-challenge-head strong{display:block;margin-top:4px;font:900 21px/1 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase}
    .result-challenge-head strong span{color:#4baeff;font-size:11px;margin:0 5px}
    .result-meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
    .result-meta-grid>div{padding:9px 10px;border:1px solid rgba(100,185,255,.09);border-radius:10px;background:rgba(2,8,15,.48)}
    .result-meta-grid b{display:block;margin-top:4px;color:#d9ecff;font-size:8px;line-height:1.35}
    .result-score-preview{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:11px 0;padding:12px 14px;border:1px solid rgba(45,224,255,.14);border-radius:12px;background:linear-gradient(90deg,rgba(8,47,73,.45),rgba(14,108,255,.06));}
    .result-score-preview span{color:#7ba0bd;font-size:8px;font-weight:900;letter-spacing:.1em}
    .result-score-preview strong{font:900 31px/1 "Barlow Condensed",sans-serif;color:#9fe9ff;letter-spacing:.05em}
    .proof-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:11px}
    .proof-grid label{padding:12px;border:1px solid rgba(100,185,255,.1);border-radius:13px;background:rgba(4,13,23,.55)}
    .result-policy{margin-top:12px;padding:11px 12px;border-left:2px solid var(--cyan);border-radius:10px;color:#89a9c2;font-size:8px;line-height:1.55;background:rgba(45,224,255,.035)}
    .result-policy strong{color:#bcefff}
    .result-record{padding:14px;border:1px solid rgba(100,185,255,.11);border-radius:15px;background:linear-gradient(180deg,rgba(8,25,42,.85),rgba(3,11,19,.9))}
    .result-record+.result-record{margin-top:9px}
    .result-record-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .result-matchup{display:flex;align-items:center;gap:7px;margin-top:4px;font:900 20px/1 "Barlow Condensed",sans-serif;letter-spacing:.035em;text-transform:uppercase}
    .result-matchup span{color:#4aaeff;font-size:9px}
    .result-score-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 11px;border:1px solid rgba(45,224,255,.12);border-radius:11px;background:rgba(45,224,255,.025)}
    .result-score-line span{color:#6f8ba5;font-size:7px;font-weight:900;letter-spacing:.1em}
    .result-score-line strong{font:900 24px/1 "Barlow Condensed",sans-serif;color:#a9eeff}
    .result-score-line em{font-style:normal;color:#67859d;font-size:7px}
    .result-proof-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
    @media(max-width:820px){
      .result-steps{grid-template-columns:1fr}
      .proof-grid{grid-template-columns:1fr}
    }
    @media(max-width:560px){
      .result-meta-grid{grid-template-columns:1fr 1fr}
      .result-challenge-head{flex-direction:column}
      .result-matchup{font-size:18px;flex-wrap:wrap}
    }

      .admin-action-grid{display:flex;flex-wrap:wrap;gap:6px}
    .team-menu{position:relative;display:inline-block}
    .team-menu-toggle{width:34px;min-width:34px;height:34px;padding:0;border-radius:10px;border:1px solid rgba(85,170,255,.18);background:rgba(7,19,32,.8);color:#bfe7ff;font-size:18px;font-weight:900;line-height:1}
    .team-menu-toggle:hover{border-color:rgba(45,224,255,.42);color:#fff}
    .team-menu-panel{display:none;position:fixed;right:auto;top:auto;z-index:120;min-width:190px;padding:6px;border:1px solid rgba(74,172,255,.2);border-radius:12px;background:rgba(5,13,23,.98);box-shadow:0 18px 45px rgba(0,0,0,.42)}
    .team-menu.open .team-menu-panel{display:block}
    .team-menu-item{display:block;width:100%;padding:10px 11px;border:0;border-radius:8px;background:transparent;color:#b8cee2;text-align:left;font-size:8px;font-weight:1000;letter-spacing:.06em;cursor:pointer}
    .team-menu-item:hover{background:rgba(25,115,210,.12);color:#fff}
    .team-menu-item.danger{color:#ff8f99}
    .team-menu-item.green{color:#83e0af}
    .quick-points{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
    .quick-points button{border:1px solid rgba(85,170,255,.14);background:rgba(10,34,56,.7);color:#9dd6ff;border-radius:7px;padding:5px 8px;font-size:8px;font-weight:900;cursor:pointer}
    .quick-points button:hover{border-color:rgba(45,224,255,.35);color:#fff}
    .team-info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px}
    .team-info-card{padding:12px;border:1px solid rgba(85,170,255,.12);border-radius:12px;background:rgba(7,19,32,.64)}
    .team-info-card small{display:block;color:#6e879f;font-size:7px;font-weight:900;letter-spacing:.14em}
    .team-info-card strong{display:block;margin-top:4px;font-family:"Barlow Condensed",sans-serif;font-size:22px;color:#f3f7fc}
    .team-member-card{padding:12px;border:1px solid rgba(85,170,255,.12);border-radius:12px;background:rgba(5,15,26,.62);margin-bottom:8px}
    .team-member-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
    .team-member-head strong{font-family:"Barlow Condensed",sans-serif;font-size:17px;letter-spacing:.03em}
    .team-member-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;color:#91a8bb;font-size:8px;line-height:1.45}
    @media(max-width:760px){.team-info-grid,.team-member-meta{grid-template-columns:1fr}.team-menu-panel{min-width:170px;max-width:calc(100vw - 16px)}}
</style>
</head>
<body>
  <div class="topline"></div>

  <div id="app"></div>

  <div id="modalBackdrop" class="modal-backdrop" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-top">
        <h3 id="modalTitle">Details</h3>
        <button class="close" id="modalClose" type="button">×</button>
      </div>
      <div id="modalBody" style="margin-top:14px"></div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="bootError" style="display:none;max-width:720px;margin:40px auto;padding:18px;border:1px solid rgba(100,190,255,.22);border-radius:16px;background:#071321;color:#eaf6ff;font-family:Inter,system-ui,sans-serif">
    <div style="color:#42a9ff;font-size:11px;font-weight:900;letter-spacing:.15em">7TH UNIVERSE ESPORTS</div>
    <h2 style="margin:8px 0 5px;font-size:20px">Website startup error</h2>
    <div id="bootErrorText" style="color:#8ba5bd;font-size:12px;line-height:1.6"></div>
  </div>

  <script>
    (function () {
      const showBootError = (message) => {
        const box = document.getElementById('bootError');
        const text = document.getElementById('bootErrorText');
        if (box && text) {
          text.textContent = message;
          box.style.display = 'block';
        }
      };

      const loadSdk = (src) => new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => reject(new Error('Could not load Supabase client SDK.'));
        document.head.appendChild(s);
      });

      window.addEventListener('error', (event) => {
        if (event?.error) showBootError(event.error.message || 'A JavaScript error stopped the website.');
      });

      (async () => {
        try {
          if (!window.supabase?.createClient) {
            try {
              await loadSdk('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2');
            } catch (_) {
              await loadSdk('https://unpkg.com/@supabase/supabase-js@2.117.2');
            }
          }

          if (!window.supabase?.createClient) {
            throw new Error('Supabase client SDK is unavailable. Check the external script/CDN access.');
          }

          const s = document.createElement('script');
          s.src = './script.js?v=esports-v19-integrated';
          s.defer = true;
          s.onerror = () => showBootError('script.js could not be loaded. Confirm that script.js is in the same GitHub/Cloudflare folder as index.html.');
          document.body.appendChild(s);
        } catch (error) {
          showBootError(error.message || 'Website startup failed.');
        }
      })();
    })();
  </script>
</body>
</html>
