<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="7TH UNIVERSE ESPORTS — Free Fire practice and recruitment platform.">
  <title>7TH UNIVERSE ESPORTS — FREE FIRE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#050505;--panel:#0d0d0d;--panel2:#111;--panel3:#151515;--line:#242424;
      --text:#f5f5f5;--muted:#9a9a9a;--red:#f10d3d;--red2:#ff365e;--blue:#198cff;
      --green:#1fd58a;--yellow:#f7c94b;--danger:#ff526e;--shadow:0 24px 70px rgba(0,0,0,.46);--radius:20px;
    }
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 88% 10%,rgba(241,13,61,.12),transparent 26%),radial-gradient(circle at 10% 90%,rgba(25,140,255,.09),transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit}button{cursor:pointer}img{max-width:100%;display:block}.hidden{display:none!important}
    .container{width:min(1220px,92%);margin-inline:auto}.app{min-height:100vh}
    .landing-shell{min-height:100vh;display:grid;place-items:center;padding:18px}.landing{width:min(1080px,100%);position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,.008));box-shadow:var(--shadow)}
    .landing:after{content:"";position:absolute;inset:auto -15% -28% 45%;height:340px;background:radial-gradient(circle,rgba(25,140,255,.10),transparent 68%);pointer-events:none}
    .landing-top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:18px 20px;border-bottom:1px solid var(--line)}
    .brand-mini{font-weight:1000;letter-spacing:1.8px;font-size:14px}.brand-mini span{color:var(--red)}
    .member-status{display:flex;align-items:center;gap:8px;color:#858585;font-size:10px;font-weight:900;letter-spacing:1.2px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(31,213,138,.72)}
    .landing-body{display:grid;grid-template-columns:1.04fr .96fr;min-height:610px}.hero{padding:58px clamp(24px,5vw,70px);display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line)}
    .eyebrow{font-size:11px;font-weight:1000;letter-spacing:2.4px;color:#5faeff;text-transform:uppercase}.hero h1{font-size:clamp(42px,6.3vw,78px);line-height:.91;letter-spacing:-4px;text-transform:uppercase;margin:13px 0}.hero h1 em{font-style:normal;color:var(--red)}.hero h2{margin:0 0 12px;font-size:22px}.hero p{max-width:640px;color:var(--muted);line-height:1.75;font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tag{padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#0c0c0c;color:#ddd;font-size:10px;font-weight:900;letter-spacing:.5px}
    .secure-note{padding:12px 13px;border:1px solid rgba(25,140,255,.22);background:rgba(25,140,255,.05);border-radius:14px;color:#9fcaff;font-size:12px;line-height:1.55;max-width:600px}.secure-note b{color:#fff}
    .auth-wrap{padding:38px;display:flex;align-items:center}.auth-box{width:100%;max-width:460px;margin-inline:auto}.login-badge{display:inline-flex;padding:7px 9px;border:1px solid rgba(25,140,255,.28);background:rgba(25,140,255,.05);border-radius:999px;color:#83c2ff;font-size:9px;font-weight:1000;letter-spacing:1px;margin-bottom:10px}.auth-box h3{margin:0 0 7px;font-size:28px}.auth-sub{margin:0 0 22px;color:var(--muted);font-size:13px;line-height:1.55}
    .form-group{margin-bottom:14px}.form-group label{display:block;margin-bottom:7px;color:#c9c9c9;font-size:11px;font-weight:900}.input,.select,.textarea{width:100%;padding:12px 13px;border:1px solid var(--line);outline:none;background:#090909;color:#fff;border-radius:12px}.input:focus,.select:focus,.textarea:focus{border-color:rgba(25,140,255,.65);box-shadow:0 0 0 3px rgba(25,140,255,.07)}.textarea{min-height:100px;resize:vertical}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hint{font-size:10px;color:#6f6f6f;margin-top:5px}
    .btn{border:0;border-radius:12px;padding:12px 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:950;font-size:12px;letter-spacing:.2px}.btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}.btn-blue{background:linear-gradient(135deg,#0c66c4,var(--blue));color:#fff}.btn-dark{background:#111;border:1px solid var(--line);color:#ddd}.btn-green{background:#0d6347;color:#fff}.btn-danger{background:#6b1021;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .btn-block{width:100%}.link-btn{border:0;background:transparent;color:#76b9ff;font-size:12px;padding:6px}.auth-foot{text-align:center;margin-top:13px;color:#777;font-size:11px}.auth-foot b{color:#ddd}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topbar-inner{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:16px;font-weight:1000;letter-spacing:1.5px;white-space:nowrap}.brand b{color:var(--red)}.nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}.nav-btn{border:1px solid transparent;background:transparent;color:#8e8e8e;border-radius:10px;padding:10px 11px;font-size:11px;font-weight:900}.nav-btn.active,.nav-btn:hover{background:#111;border-color:var(--line);color:#fff}.user{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#0b0b0b}.avatar-fallback{display:grid;place-items:center;font-size:11px;font-weight:1000}.user-meta{font-size:10px;line-height:1.35}.user-meta b{display:block;color:#eee;font-size:11px}.user-meta span{color:#777}
    .page{padding:32px 0 60px}.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin-bottom:19px}.title h2{margin:0 0 5px;font-size:28px}.title p{margin:0;color:#8f8f8f;font-size:13px;line-height:1.55}.section{margin-top:24px}
    .hero-card{border:1px solid var(--line);border-radius:22px;padding:26px;background:linear-gradient(135deg,rgba(241,13,61,.10),rgba(25,140,255,.05),rgba(255,255,255,.015));box-shadow:var(--shadow)}.hero-card h2{margin:0 0 7px;font-size:30px}.hero-card p{margin:0;color:#aaa;line-height:1.65;max-width:780px}.action-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.stat{border:1px solid var(--line);border-radius:16px;background:#0c0c0c;padding:17px}.stat small{display:block;color:#707070;font-size:9px;font-weight:900;letter-spacing:.9px}.stat strong{display:block;font-size:27px;margin-top:8px}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.cards3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#101010,#0c0c0c);padding:16px}.card-head{display:flex;align-items:center;gap:12px}.team-logo{width:55px;height:55px;border-radius:14px;object-fit:cover;border:1px solid #262626;background:#060606}.logo-fallback{display:grid;place-items:center;font-weight:1000;font-size:16px}.card h3{margin:0;font-size:17px}.card .muted{color:#777;font-size:11px;margin-top:4px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0}.badge{padding:6px 8px;border-radius:999px;border:1px solid var(--line);font-size:9px;font-weight:950;color:#cfcfcf;background:#111}.badge.red{border-color:rgba(241,13,61,.34);background:rgba(241,13,61,.07);color:#ff839a}.badge.blue{border-color:rgba(25,140,255,.34);background:rgba(25,140,255,.07);color:#80bfff}.badge.green{border-color:rgba(31,213,138,.34);background:rgba(31,213,138,.06);color:#72ebba}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info{padding:10px;border:1px solid #1a1a1a;border-radius:11px;background:#090909}.info small{display:block;color:#626262;font-size:8px;text-transform:uppercase;letter-spacing:.65px;margin-bottom:4px}.info strong{display:block;color:#d9d9d9;font-size:11px;line-height:1.4}.notes{color:#8f8f8f;font-size:11px;line-height:1.55;margin:12px 0 0}.card-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
    .empty{padding:45px 18px;text-align:center;border:1px dashed #292929;border-radius:16px;color:#777}.empty strong{display:block;color:#ddd;margin-bottom:5px}
    .admin-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}.admin-nav{border:1px solid var(--line);border-radius:16px;background:#0c0c0c;padding:9px;height:max-content;position:sticky;top:86px}.admin-nav button{width:100%;border:0;background:transparent;color:#8c8c8c;text-align:left;border-radius:10px;padding:11px;font-size:11px;font-weight:900}.admin-nav button.active,.admin-nav button:hover{background:#151515;color:#fff}.admin-main{min-width:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px 12px;border-bottom:1px solid #202020;text-align:left;font-size:11px;vertical-align:top}th{color:#6f6f6f;font-size:9px;text-transform:uppercase;letter-spacing:.7px}tr:last-child td{border-bottom:0}.mini-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;background:#060606;border:1px solid #222}
    .modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.76)}.modal.open{display:flex}.modal-box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#0e0e0e;border:1px solid var(--line);border-radius:20px;padding:18px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.modal-head h3{margin:0;font-size:18px}.close{width:34px;height:34px;border:1px solid var(--line);background:#111;color:#aaa;border-radius:10px;font-size:19px}.modal-body{margin-top:15px}
    #toast{position:fixed;right:15px;bottom:15px;z-index:200;display:none;max-width:360px;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#111;box-shadow:var(--shadow);font-size:12px;line-height:1.5}.toast-show{display:block!important}.toast-error{border-color:rgba(241,13,61,.45)}.toast-success{border-color:rgba(31,213,138,.40)}
    @media(max-width:980px){.landing-body{grid-template-columns:1fr}.hero{border-right:0;border-bottom:1px solid var(--line)}.cards,.cards3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.admin-layout{grid-template-columns:1fr}.admin-nav{position:static;display:flex;overflow:auto;gap:4px}.admin-nav button{width:auto;white-space:nowrap}.user-meta{display:none}}
    @media(max-width:680px){.landing-shell{padding:8px}.landing-top{padding:15px}.landing-body{min-height:auto}.hero{padding:34px 22px}.hero h1{letter-spacing:-2.5px}.auth-wrap{padding:24px 20px}.grid2,.grid3,.info-grid{grid-template-columns:1fr}.topbar-inner{min-height:auto;padding:10px 0;flex-wrap:wrap}.nav{width:100%;order:3;overflow:auto;justify-content:flex-start;flex-wrap:nowrap}.nav-btn{white-space:nowrap}.title-row{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.page{padding-top:22px}}
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle">Details</h3><button id="modalClose" class="close" type="button">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./script.js"></script>
</body>
</html>
