<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <meta name="description" content="7TH UNIVERSE ESPORTS — Free Fire esports practice and recruitment platform.">
  <title>7TH UNIVERSE ESPORTS | FREE FIRE</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --bg:#040913;
      --bg2:#06101f;
      --panel:#081321;
      --panel2:#0c1929;
      --panel3:#0f2033;
      --line:#19324d;
      --line2:#214564;
      --text:#f6f9ff;
      --muted:#94a9bf;
      --blue:#1677ff;
      --blue2:#39a0ff;
      --cyan:#23d5f2;
      --red:#ef2747;
      --red2:#ff4966;
      --green:#22c77a;
      --yellow:#ffd166;
      --shadow:0 30px 80px rgba(0,0,0,.45);
      --radius:20px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 84% 5%,rgba(22,119,255,.18),transparent 25%),
        radial-gradient(circle at 15% 85%,rgba(35,213,242,.07),transparent 24%),
        linear-gradient(180deg,#020710 0%,#06101c 48%,#03070f 100%);
      overflow-x:hidden;
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:linear-gradient(to bottom,black,transparent 85%);
    }

    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    input,select,textarea{outline:none}
    img{display:block;max-width:100%}
    a{text-decoration:none;color:inherit}
    .hidden{display:none !important}
    .container{width:min(1180px,92%);margin:0 auto}
    .muted{color:var(--muted)}

    /* Generic buttons */
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:9px;
      border:1px solid transparent;border-radius:12px;padding:12px 16px;
      color:#fff;font-weight:900;letter-spacing:.25px;transition:.18s ease;
    }
    .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
    .btn-primary{
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      box-shadow:0 10px 26px rgba(22,119,255,.22)
    }
    .btn-red{
      background:linear-gradient(135deg,var(--red),var(--red2));
      box-shadow:0 10px 26px rgba(239,39,71,.2)
    }
    .btn-dark{background:#0b1724;border-color:var(--line);color:#dbe8f6}
    .btn-green{background:#0c5a3d;color:#dfffee}
    .btn-danger{background:#681528;color:#fff}
    .btn-small{padding:9px 11px;font-size:12px;border-radius:10px}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    /* Public auth */
    .public-shell{min-height:100vh;display:grid;place-items:center;padding:18px}
    .auth-frame{
      width:min(1120px,100%);
      border:1px solid rgba(36,76,112,.62);
      border-radius:28px;
      overflow:hidden;
      background:linear-gradient(180deg,rgba(8,22,38,.95),rgba(3,9,17,.98));
      box-shadow:var(--shadow);
      position:relative;
    }
    .auth-frame:after{
      content:"";position:absolute;right:-100px;top:-100px;width:340px;height:340px;
      background:radial-gradient(circle,rgba(22,119,255,.19),transparent 68%);
      pointer-events:none;
    }

    .auth-top{
      min-height:72px;display:grid;grid-template-columns:1fr auto 1fr;
      align-items:center;gap:14px;padding:14px 18px;
      border-bottom:1px solid rgba(36,76,112,.5);
      position:relative;z-index:2;
    }
    .auth-top .right-actions{justify-content:flex-end}
    .left-actions{justify-content:flex-start}
    .brand{
      font-weight:1000;letter-spacing:1.7px;font-size:16px;white-space:nowrap
    }
    .brand .b{color:var(--blue2)}
    .brand .r{color:var(--red2)}
    .member-state{
      display:flex;align-items:center;gap:8px;color:#9ab0c8;font-size:10px;
      letter-spacing:1.1px;font-weight:900
    }
    .live-dot{
      width:8px;height:8px;border-radius:50%;background:var(--green);
      box-shadow:0 0 13px rgba(34,199,122,.7)
    }

    .auth-top-actions{display:flex;align-items:center;gap:8px}
    .auth-action{
      background:#091523;border:1px solid var(--line);color:#bcd0e4;
      padding:10px 12px;border-radius:11px;font-size:10px;font-weight:1000;
      letter-spacing:.35px
    }
    .auth-action.admin{
      border-color:#24527a;color:#9bcfff;
      background:linear-gradient(135deg,rgba(22,119,255,.10),rgba(9,21,35,.96))
    }
    .auth-action:hover{border-color:#2b5c88;color:#fff}
    .auth-action.register{
      background:linear-gradient(135deg,rgba(22,119,255,.18),rgba(57,160,255,.1));
      border-color:rgba(57,160,255,.42);color:#e8f4ff
    }

    .auth-layout{display:grid;grid-template-columns:1.08fr .92fr;min-height:670px}
    .auth-copy{
      padding:64px clamp(28px,5vw,70px);display:flex;justify-content:center;flex-direction:column;
      border-right:1px solid rgba(36,76,112,.38);position:relative
    }
    .eyebrow{
      color:#71b8ff;font-size:11px;font-weight:1000;letter-spacing:2.6px;text-transform:uppercase
    }
    .auth-copy h1{
      font-size:clamp(48px,6vw,78px);line-height:.9;letter-spacing:-3px;
      margin:14px 0 16px;text-transform:uppercase
    }
    .auth-copy h1 .white{color:#f8fbff}
    .auth-copy h1 .blue{color:var(--blue2)}
    .auth-copy h1 .red{color:var(--red2)}
    .auth-copy h2{font-size:24px;margin:0 0 14px;letter-spacing:-.5px}
    .auth-copy p{
      color:var(--muted);font-size:14px;line-height:1.75;max-width:600px;margin:0
    }

    .feature-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px
    }
    .feature{
      border:1px solid #17304a;border-radius:15px;padding:13px 14px;background:rgba(8,18,30,.72)
    }
    .feature b{display:block;font-size:12px;margin-bottom:4px}
    .feature span{font-size:10px;color:#7690a7;line-height:1.45}

    .security-strip{
      margin-top:24px;padding:13px 14px;border:1px solid rgba(35,213,242,.24);
      border-radius:14px;background:rgba(35,213,242,.045);color:#bceeff;font-size:11px;line-height:1.5
    }

    .auth-panel{
      padding:42px clamp(22px,4vw,54px);display:flex;align-items:center;
    }
    .auth-card{width:min(470px,100%);margin:auto}
    .auth-card .badge{
      display:inline-flex;padding:7px 9px;border:1px solid rgba(57,160,255,.32);border-radius:999px;
      color:#8dccff;background:rgba(57,160,255,.06);font-size:9px;font-weight:1000;letter-spacing:1.1px
    }
    .auth-card h3{font-size:30px;margin:12px 0 7px;letter-spacing:-.8px}
    .auth-sub{font-size:13px;color:#7f96ad;line-height:1.55;margin:0 0 24px}

    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{margin-bottom:14px}
    .field label{
      display:block;color:#b8cbe0;font-size:10px;font-weight:1000;
      letter-spacing:1px;text-transform:uppercase;margin-bottom:7px
    }
    .field input,.field select,.field textarea{
      width:100%;padding:12px 13px;border-radius:12px;border:1px solid #1c3852;
      background:#06111e;color:#edf5ff;
    }
    .field textarea{min-height:110px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(57,160,255,.75);box-shadow:0 0 0 3px rgba(57,160,255,.08)}
    .field input::placeholder,.field textarea::placeholder{color:#556c82}
    .hint{font-size:10px;color:#60788f;margin-top:5px;line-height:1.45}

    .auth-note{
      margin-top:15px;text-align:center;font-size:10px;color:#6f869d;line-height:1.55
    }
    .link-btn{
      border:0;background:transparent;padding:0;color:#7fc3ff;font-weight:800
    }

    /* App shell */
    .topbar{
      position:sticky;top:0;z-index:60;
      background:rgba(3,9,16,.88);backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(36,76,112,.55)
    }
    .topbar-inner{
      min-height:74px;display:flex;align-items:center;gap:18px;justify-content:space-between
    }
    .nav{
      display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center
    }
    .nav-btn{
      padding:10px 12px;background:transparent;border:1px solid transparent;
      color:#8096ab;border-radius:10px;font-size:11px;font-weight:900
    }
    .nav-btn.active,.nav-btn:hover{color:#fff;background:#0a1725;border-color:#1a3650}
    .profile-chip{display:flex;align-items:center;gap:10px}
    .avatar{
      width:36px;height:36px;border-radius:11px;border:1px solid #234562;
      object-fit:cover;background:#07111d
    }
    .avatar-placeholder{
      display:grid;place-items:center;color:#8bc8ff;font-weight:1000;font-size:11px
    }
    .profile-text small{display:block;color:#5f768d;font-size:9px;text-transform:uppercase;letter-spacing:.6px}
    .profile-text b{font-size:12px}

    .page{padding:30px 0 65px}
    .page-heading{margin-bottom:22px}
    .page-heading h2{margin:0 0 5px;font-size:30px;letter-spacing:-.8px}
    .page-heading p{margin:0;color:#7890a7;font-size:13px;line-height:1.6}

    .dashboard-hero{
      border:1px solid #1c4468;border-radius:22px;padding:28px;
      background:
        radial-gradient(circle at 90% 10%,rgba(22,119,255,.18),transparent 30%),
        linear-gradient(135deg,rgba(13,31,50,.94),rgba(6,14,24,.98));
      box-shadow:var(--shadow);
    }
    .dashboard-hero .mini{
      color:#70b9ff;font-size:10px;font-weight:1000;letter-spacing:2px
    }
    .dashboard-hero h2{font-size:34px;margin:9px 0 8px}
    .dashboard-hero p{color:#8ca2b8;max-width:850px;line-height:1.7;margin:0}
    .hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}

    .quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
    .quick{
      padding:16px;border:1px solid #17324c;border-radius:16px;background:#081422;
      text-align:left
    }
    .quick .qicon{font-size:20px}
    .quick b{display:block;margin-top:10px;font-size:13px}
    .quick span{display:block;margin-top:4px;color:#657e95;font-size:10px;line-height:1.45}

    .section{margin-top:28px}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:13px}
    .section-title h3{margin:0;font-size:18px}
    .section-title span{color:#5d768e;font-size:10px}

    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .cards-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{
      border:1px solid #16324c;border-radius:18px;padding:16px;background:linear-gradient(180deg,#081422,#07101b)
    }
    .card-top{display:flex;gap:11px;align-items:center}
    .team-logo{
      width:56px;height:56px;border-radius:14px;border:1px solid #1d4161;
      object-fit:cover;background:#030a11
    }
    .team-logo.placeholder{display:grid;place-items:center;color:#78bbf2;font-weight:1000}
    .card-title h3{margin:0;font-size:17px}
    .card-title p{margin:4px 0 0;color:#688096;font-size:10px}
    .badges{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}
    .badge2{
      padding:6px 8px;border-radius:999px;background:#0b1827;border:1px solid #1a344d;
      color:#afc1d3;font-size:9px;font-weight:1000;text-transform:uppercase
    }
    .badge2.blue{color:#8dcbff;border-color:#275985;background:rgba(22,119,255,.08)}
    .badge2.red{color:#ff91a5;border-color:#642238;background:rgba(239,39,71,.08)}
    .badge2.green{color:#83e7b6;border-color:#236247;background:rgba(34,199,122,.06)}
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .info{
      padding:10px;border-radius:11px;border:1px solid #12283d;background:#05101a
    }
    .info small{display:block;color:#5d748a;font-size:8px;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
    .info b{font-size:11px;color:#d9e6f3}
    .note-text{font-size:11px;color:#7f95ab;line-height:1.55;margin:12px 0 0}
    .card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}

    .empty{
      border:1px dashed #1b3a57;border-radius:17px;padding:42px 16px;text-align:center;color:#678097
    }

    /* Admin */
    .admin-layout{display:grid;grid-template-columns:220px 1fr;gap:16px}
    .admin-nav{
      border:1px solid #17334d;border-radius:16px;background:#07111d;padding:8px;
      height:max-content;position:sticky;top:90px
    }
    .admin-nav button{
      display:block;width:100%;text-align:left;padding:11px;border-radius:10px;
      border:1px solid transparent;background:transparent;color:#8096ab;font-size:11px;font-weight:900
    }
    .admin-nav button.active,.admin-nav button:hover{background:#0b1928;color:#fff;border-color:#1a3853}
    .table-shell{overflow:auto;border:1px solid #17334d;border-radius:16px}
    table{width:100%;min-width:780px;border-collapse:collapse}
    th,td{padding:12px;border-bottom:1px solid #132b40;text-align:left;vertical-align:top;font-size:11px}
    th{color:#5f7890;font-size:9px;text-transform:uppercase;letter-spacing:.8px}
    tr:last-child td{border-bottom:0}

    /* Modal/toast */
    .modal{
      position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;
      padding:16px;background:rgba(0,0,0,.72)
    }
    .modal.open{display:flex}
    .modal-card{
      width:min(700px,100%);max-height:90vh;overflow:auto;
      border:1px solid #244b6b;border-radius:20px;background:#07111d;padding:20px;
      box-shadow:var(--shadow)
    }
    .modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .modal-top h3{margin:0;font-size:19px}
    .close{
      width:34px;height:34px;border-radius:10px;border:1px solid #1c3853;
      background:#0b1826;color:#a8bdd0
    }
    #toast{
      position:fixed;right:16px;bottom:16px;z-index:120;max-width:360px;
      display:none;padding:13px 15px;border-radius:13px;background:#081421;
      border:1px solid #234763;box-shadow:var(--shadow);font-size:12px
    }
    #toast.show{display:block}
    #toast.error{border-color:#6b2338;color:#ffb0be}
    #toast.success{border-color:#235e47;color:#a4efc8}

    .hero-visual{position:absolute;right:5%;top:8%;width:215px;height:215px;pointer-events:none;opacity:.82}
    .hero-visual .ring{position:absolute;inset:10px;border:1px solid rgba(57,160,255,.22);border-radius:50%;box-shadow:0 0 46px rgba(22,119,255,.10)}
    .hero-visual .ring.r2{inset:36px;border-color:rgba(35,213,242,.25);transform:rotate(32deg) scaleY(.72)}
    .hero-visual .ring.r3{inset:58px;border-color:rgba(239,39,71,.18);transform:rotate(-38deg) scaleX(.78)}
    .hero-visual .core{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%) rotate(45deg);border:1px solid rgba(57,160,255,.48);background:linear-gradient(135deg,rgba(22,119,255,.24),rgba(35,213,242,.05));box-shadow:0 0 34px rgba(22,119,255,.22)}
    .hero-visual .core:after{content:"7U";position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-45deg);font-size:10px;font-weight:1000;letter-spacing:1px;color:#c4e5ff}
    .section-kicker{display:inline-flex;align-items:center;gap:7px;color:#6eabdf;font-size:9px;font-weight:1000;letter-spacing:1.2px;text-transform:uppercase}
    .section-kicker:before{content:"";width:18px;height:1px;background:#2f8cff}
    .status-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#08192a;border:1px solid #1b3d5c;color:#8fcaff;font-size:9px;font-weight:1000;letter-spacing:.8px;text-transform:uppercase}
    .status-pill .tiny-dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(34,199,122,.7)}
    .admin-highlight{border:1px solid rgba(57,160,255,.25);background:linear-gradient(135deg,rgba(22,119,255,.08),rgba(4,12,21,.96));border-radius:17px;padding:15px;margin-bottom:14px}

    /* Responsive */
    @media (max-width:1000px){
      .auth-layout{grid-template-columns:1fr}
      .auth-copy{border-right:0;border-bottom:1px solid rgba(36,76,112,.38)}
      .cards-3{grid-template-columns:1fr 1fr}
      .quick-grid{grid-template-columns:1fr 1fr}
    }
    @media (max-width:760px){
      .auth-top{
        grid-template-columns:1fr auto;
        grid-template-areas:"brand register" "admin state";
        align-items:center
      }
      .auth-top .brand{grid-area:brand}
      .auth-top .left-actions{grid-area:admin}
      .auth-top .right-actions{grid-area:register;align-items:flex-end;flex-direction:column}
      .auth-top .member-state{grid-area:state;justify-content:flex-end}
      .auth-top-actions{gap:6px}
      .auth-action{font-size:9px;padding:9px 9px}
      .auth-layout{min-height:auto}
      .auth-copy{padding:42px 24px}
      .auth-panel{padding:28px 20px 34px}
      .auth-copy h1{font-size:50px}
      .feature-grid{grid-template-columns:1fr}
      .topbar-inner{padding:9px 0;flex-wrap:wrap}
      .nav{order:3;width:100%;overflow:auto;justify-content:flex-start;flex-wrap:nowrap}
      .profile-text{display:none}
      .admin-layout{grid-template-columns:1fr}
      .admin-nav{position:static;display:flex;overflow:auto;gap:5px}
      .admin-nav button{width:auto;white-space:nowrap}
      .cards,.cards-3{grid-template-columns:1fr}
    }
    @media (max-width:540px){
      .form-grid{grid-template-columns:1fr}
      .info-grid{grid-template-columns:1fr}
      .quick-grid{grid-template-columns:1fr 1fr}
      .page-heading h2{font-size:25px}
      .dashboard-hero h2{font-size:27px}
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-top">
        <h3 id="modalTitle">Details</h3>
        <button class="close" id="modalClose" type="button">×</button>
      </div>
      <div id="modalBody" style="margin-top:16px"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="./script.js"></script>
</body>
</html>
